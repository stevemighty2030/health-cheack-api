# Azure DevOps CD pipeline: verified GitOps promotion through dev, UAT, and production.
# Create variable group "db-health-check-cd" with:
#   GITOPS_REPOSITORY: clone URL of the external GitOps repository
#   GITOPS_BRANCH: branch watched by Argo CD, normally main
#   GITOPS_TOKEN: secret PAT with repository push permission
#   GITOPS_VALUES_FILE_DEV: dev Helm values.yaml path
#   GITOPS_VALUES_FILE_UAT: UAT Helm values.yaml path
#   GITOPS_VALUES_FILE_PROD: production Helm values.yaml path
#   COSIGN_PUBLIC_KEY: public key matching the CI signing key

trigger: none
pr: none

# Set rollback to true when manually running this pipeline to restore a prior image.
# Leave rollback false for the normal verified dev -> UAT -> production promotion.
parameters:
  - name: rollback
    displayName: Roll back a deployment
    type: boolean
    default: false
  - name: rollbackEnvironment
    displayName: Rollback environment
    type: string
    default: prod
    values:
      - dev
      - uat
      - prod
  - name: previousImageTag
    displayName: Previous image tag
    # Enter the previously deployed, known-good commit SHA stored in ACR.
    type: string
    default: ''

resources:
  pipelines:
    - pipeline: ci
      source: db-health-check-ci
      trigger:
        branches:
          include:
            - main

variables:
  - group: db-health-check-cd
  - name: imageRepository
    value: db-health-check
  - name: cosignVersion
    value: '2.4.1'

stages:
  # Verify the image and signature from the exact CI run before any promotion.
  - stage: VerifyImage
    displayName: Verify CI image signature
    # Rollbacks use an existing trusted tag and do not need the new CI artifact.
    condition: and(succeeded(), eq('${{ parameters.rollback }}', 'false'))
    jobs:
      - job: VerifyImage
        displayName: Verify Cosign signature
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - task: DownloadPipelineArtifact@2
            # Pin both downloads to the CI run that triggered this CD pipeline.
            displayName: Download CI image artifact
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              definition: $(resources.pipeline.ci.pipelineID)
              specificBuildWithTriggering: true
              buildVersionToDownload: specific
              pipelineId: $(resources.pipeline.ci.runID)
              artifactName: db-health-check-image
              targetPath: $(Pipeline.Workspace)/db-health-check-image
          - task: DownloadPipelineArtifact@2
            displayName: Download CI Cosign signature
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              definition: $(resources.pipeline.ci.pipelineID)
              specificBuildWithTriggering: true
              buildVersionToDownload: specific
              pipelineId: $(resources.pipeline.ci.runID)
              artifactName: db-health-check-signature
              targetPath: $(Pipeline.Workspace)/db-health-check-signature
          - bash: |
              # Verify the public-key signature against the exact CI image tarball.
              # A missing file or mismatch exits nonzero and blocks every deployment.
              set -euo pipefail
              test -s "$(Pipeline.Workspace)/db-health-check-image/db-health-check.tar"
              test -s "$(Pipeline.Workspace)/db-health-check-signature/db-health-check.tar.sig"
              docker run --rm \
                -e COSIGN_PUBLIC_KEY \
                -v "$(Pipeline.Workspace)/db-health-check-image:/image" \
                -v "$(Pipeline.Workspace)/db-health-check-signature:/signature" \
                gcr.io/projectsigstore/cosign:v$(cosignVersion) \
                verify-blob \
                --key env://COSIGN_PUBLIC_KEY \
                --signature /signature/db-health-check.tar.sig \
                /image/db-health-check.tar
            displayName: Fail if image signature is missing or mismatched
            env:
              COSIGN_PUBLIC_KEY: $(COSIGN_PUBLIC_KEY)

  # Dev auto-syncs in Argo CD after this GitOps commit.
  - stage: DeployDev
    displayName: Deploy to dev through GitOps
    dependsOn: VerifyImage
    # Argo CD automatically syncs dev after this GitOps commit.
    condition: and(succeeded(), eq('${{ parameters.rollback }}', 'false'))
    jobs:
      - job: DeployDev
        displayName: Update dev GitOps file
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail
              auth_header=$(printf ':%s' "${GITOPS_TOKEN}" | base64 -w 0)
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" clone --branch "${GITOPS_BRANCH:-main}" "${GITOPS_REPOSITORY}" gitops-repo
              cd gitops-repo
              git config user.name "Azure DevOps"
              git config user.email "azuredevops@local"
              python - <<'PY'
              from pathlib import Path
              import os
              import re

                file_path = Path(os.environ['GITOPS_VALUES_FILE'])
              contents = file_path.read_text()
              image = os.environ['IMAGE']
              tag = os.environ['IMAGE_TAG']
                updated, repository_count = re.subn(r'(?m)^(\s*repository:\s*).+$', rf'\g<1>{image}', contents, count=1)
                updated, tag_count = re.subn(r'(?m)^(\s*tag:\s*).+$', rf'\g<1>{tag}', updated, count=1)
                if repository_count + tag_count != 2:
                  raise SystemExit(f'Expected repository and tag fields in {file_path}')
              file_path.write_text(updated)
              PY
                git add "${GITOPS_VALUES_FILE}"
              git diff --cached --quiet && echo "Dev already uses ${IMAGE_TAG}" && exit 0
              git commit -m "Promote ${IMAGE_TAG} to dev [skip ci]"
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" push origin "${GITOPS_BRANCH:-main}"
            displayName: Commit dev image update
            env:
              GITOPS_REPOSITORY: $(GITOPS_REPOSITORY)
              GITOPS_BRANCH: $(GITOPS_BRANCH)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
              GITOPS_VALUES_FILE: $(GITOPS_VALUES_FILE_DEV)
              IMAGE: $(ACR_LOGIN_SERVER)/$(imageRepository)
              IMAGE_TAG: $(resources.pipeline.ci.sourceCommit)

  # UAT auto-syncs after dev succeeds and the GitOps update is committed.
  - stage: DeployUat
    displayName: Deploy to UAT through GitOps
    dependsOn: DeployDev
    # UAT is promoted only after the dev GitOps update succeeds.
    condition: and(succeeded(), eq('${{ parameters.rollback }}', 'false'))
    jobs:
      - job: DeployUat
        displayName: Update UAT GitOps file
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail
              auth_header=$(printf ':%s' "${GITOPS_TOKEN}" | base64 -w 0)
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" clone --branch "${GITOPS_BRANCH:-main}" "${GITOPS_REPOSITORY}" gitops-repo
              cd gitops-repo
              git config user.name "Azure DevOps"
              git config user.email "azuredevops@local"
              python - <<'PY'
              from pathlib import Path
              import os
              import re

                file_path = Path(os.environ['GITOPS_VALUES_FILE'])
              contents = file_path.read_text()
              image = os.environ['IMAGE']
              tag = os.environ['IMAGE_TAG']
                updated, repository_count = re.subn(r'(?m)^(\s*repository:\s*).+$', rf'\g<1>{image}', contents, count=1)
                updated, tag_count = re.subn(r'(?m)^(\s*tag:\s*).+$', rf'\g<1>{tag}', updated, count=1)
                if repository_count + tag_count != 2:
                  raise SystemExit(f'Expected repository and tag fields in {file_path}')
              file_path.write_text(updated)
              PY
                git add "${GITOPS_VALUES_FILE}"
              git diff --cached --quiet && echo "UAT already uses ${IMAGE_TAG}" && exit 0
              git commit -m "Promote ${IMAGE_TAG} to UAT [skip ci]"
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" push origin "${GITOPS_BRANCH:-main}"
            displayName: Commit UAT image update
            env:
              GITOPS_REPOSITORY: $(GITOPS_REPOSITORY)
              GITOPS_BRANCH: $(GITOPS_BRANCH)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
              GITOPS_VALUES_FILE: $(GITOPS_VALUES_FILE_UAT)
              IMAGE: $(ACR_LOGIN_SERVER)/$(imageRepository)
              IMAGE_TAG: $(resources.pipeline.ci.sourceCommit)

  # Production Argo CD has auto-sync disabled, and Azure DevOps adds an approval gate too.
  - stage: Approval
    displayName: Approve production promotion
    dependsOn: DeployUat
    # Production approval is reached only after dev and UAT promotion.
    condition: and(succeeded(), eq('${{ parameters.rollback }}', 'false'))
    jobs:
      - job: ManualApproval
        displayName: Manual production approval
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: '$(Build.RequestedForEmail)'
              instructions: 'Review dev and UAT, then approve production promotion for image $(resources.pipeline.ci.sourceCommit).'
              onTimeout: reject

  - stage: DeployProd
    displayName: Deploy to production through GitOps
    dependsOn: Approval
    # Argo CD production auto-sync is disabled; this commit is followed by manual sync.
    condition: and(succeeded(), eq('${{ parameters.rollback }}', 'false'))
    jobs:
      - job: DeployProd
        displayName: Update production GitOps file
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail
              auth_header=$(printf ':%s' "${GITOPS_TOKEN}" | base64 -w 0)
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" clone --branch "${GITOPS_BRANCH:-main}" "${GITOPS_REPOSITORY}" gitops-repo
              cd gitops-repo
              git config user.name "Azure DevOps"
              git config user.email "azuredevops@local"
              python - <<'PY'
              from pathlib import Path
              import os
              import re

                file_path = Path(os.environ['GITOPS_VALUES_FILE'])
              contents = file_path.read_text()
              image = os.environ['IMAGE']
              tag = os.environ['IMAGE_TAG']
                updated, repository_count = re.subn(r'(?m)^(\s*repository:\s*).+$', rf'\g<1>{image}', contents, count=1)
                updated, tag_count = re.subn(r'(?m)^(\s*tag:\s*).+$', rf'\g<1>{tag}', updated, count=1)
                if repository_count + tag_count != 2:
                  raise SystemExit(f'Expected repository and tag fields in {file_path}')
              file_path.write_text(updated)
              PY
                git add "${GITOPS_VALUES_FILE}"
              git diff --cached --quiet && echo "Production already uses ${IMAGE_TAG}" && exit 0
              git commit -m "Promote ${IMAGE_TAG} to production [skip ci]"
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" push origin "${GITOPS_BRANCH:-main}"
            displayName: Commit production image update
            env:
              GITOPS_REPOSITORY: $(GITOPS_REPOSITORY)
              GITOPS_BRANCH: $(GITOPS_BRANCH)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
              GITOPS_VALUES_FILE: $(GITOPS_VALUES_FILE_PROD)
              IMAGE: $(ACR_LOGIN_SERVER)/$(imageRepository)
              IMAGE_TAG: $(resources.pipeline.ci.sourceCommit)

  # Manual rollback mode skips normal promotion and restores the supplied previous
  # image tag by updating the selected Helm values.yaml file.
  # Argo CD then reconciles the selected environment back to that image.
  - stage: Rollback
    displayName: Roll back a previous image
    # This stage runs only when the pipeline is manually started with rollback=true.
    condition: and(succeeded(), eq('${{ parameters.rollback }}', 'true'))
    jobs:
      - job: Rollback
        displayName: Restore previous image tag
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail
              # The operator must provide a known-good tag already available in ACR.
              test -n "${ROLLBACK_IMAGE_TAG}"
              # Select only the environment file requested by the manual run.
              case "${ROLLBACK_ENVIRONMENT}" in
                dev) gitops_file="${GITOPS_VALUES_FILE_DEV}" ;;
                uat) gitops_file="${GITOPS_VALUES_FILE_UAT}" ;;
                prod) gitops_file="${GITOPS_VALUES_FILE_PROD}" ;;
                *) echo "Unsupported rollback environment" >&2; exit 1 ;;
              esac
              export GITOPS_FILE="${gitops_file}"
              # Update GitOps; Argo CD will reconcile the selected environment.
              auth_header=$(printf ':%s' "${GITOPS_TOKEN}" | base64 -w 0)
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" clone --branch "${GITOPS_BRANCH:-main}" "${GITOPS_REPOSITORY}" gitops-repo
              cd gitops-repo
              git config user.name "Azure DevOps"
              git config user.email "azuredevops@local"
              python - <<'PY'
              from pathlib import Path
              import os
              import re

                file_path = Path(os.environ['GITOPS_FILE'])
              contents = file_path.read_text()
              tag = os.environ['ROLLBACK_IMAGE_TAG']
                updated, count = re.subn(r'(?m)^(\s*tag:\s*).+$', rf'\g<1>{tag}', contents, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one Helm tag field in {file_path}, found {count}')
              file_path.write_text(updated)
              PY
              git add "${gitops_file}"
              git diff --cached --quiet && echo "${ROLLBACK_ENVIRONMENT} already uses ${ROLLBACK_IMAGE_TAG}" && exit 0
              git commit -m "Roll back ${ROLLBACK_ENVIRONMENT} to ${ROLLBACK_IMAGE_TAG} [skip ci]"
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" push origin "${GITOPS_BRANCH:-main}"
            displayName: Commit rollback image tag
            env:
              GITOPS_REPOSITORY: $(GITOPS_REPOSITORY)
              GITOPS_BRANCH: $(GITOPS_BRANCH)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
              GITOPS_VALUES_FILE_DEV: $(GITOPS_VALUES_FILE_DEV)
              GITOPS_VALUES_FILE_UAT: $(GITOPS_VALUES_FILE_UAT)
              GITOPS_VALUES_FILE_PROD: $(GITOPS_VALUES_FILE_PROD)
              ROLLBACK_ENVIRONMENT: ${{ parameters.rollbackEnvironment }}
              ROLLBACK_IMAGE_TAG: ${{ parameters.previousImageTag }}
              GITOPS_FILE: $(GITOPS_VALUES_FILE_PROD)
              IMAGE: $(ACR_LOGIN_SERVER)/$(imageRepository)

# Azure DevOps CD pipeline: approval-gated GitOps promotion.
# Create an Azure DevOps variable group named "db-health-check-cd" with:
#   GITOPS_REPOSITORY: clone URL of the GitOps repository
#   GITOPS_BRANCH: branch watched by Argo CD (default: main)
#   GITOPS_TOKEN: secret PAT with permission to push that repository
#   GITOPS_UPDATE_MODE: helm-values or manifest
#   GITOPS_FILE: path in the GitOps repository to the values or manifest file

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: ci
      source: db-health-check-ci
      trigger:
        branches:
          include:
            - main

variables:
  - group: db-health-check-cd
  - name: imageRepository
    value: db-health-check

stages:
  - stage: Approval
    displayName: Approve production promotion
    jobs:
      - job: ManualApproval
        displayName: Manual production approval
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: '$(Build.RequestedForEmail)'
              instructions: 'Review the CI run, image $(resources.pipeline.ci.runID), and production change. Resume to promote through GitOps.'
              onTimeout: reject

  - stage: Promote
    displayName: Update GitOps repository
    dependsOn: Approval
    condition: succeeded()
    jobs:
      - job: UpdateGitOps
        displayName: Commit approved image tag
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              auth_header=$(printf ':%s' "${GITOPS_TOKEN}" | base64 -w 0)
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" clone --branch "${GITOPS_BRANCH:-main}" "${GITOPS_REPOSITORY}" gitops-repo
              cd gitops-repo
              git config user.name "Azure DevOps"
              git config user.email "azuredevops@local"

              python - <<'PY'
              from pathlib import Path
              import os
              import re

              file_path = Path(os.environ['GITOPS_FILE'])
              contents = file_path.read_text()
              image = os.environ['IMAGE']
              tag = os.environ['IMAGE_TAG']

              if os.environ['GITOPS_UPDATE_MODE'] == 'helm-values':
                  updated, repository_count = re.subn(
                      r'(?m)^(\s*repository:\s*).+$',
                      rf'\g<1>{image}',
                      contents,
                      count=1,
                  )
                  updated, tag_count = re.subn(
                      r'(?m)^(\s*tag:\s*).+$',
                      rf'\g<1>{tag}',
                      updated,
                      count=1,
                  )
                  count = repository_count + tag_count
              elif os.environ['GITOPS_UPDATE_MODE'] == 'manifest':
                  updated, count = re.subn(
                      r'(?m)^(\s*image:\s*).+$',
                      rf'\g<1>{image}:{tag}',
                      contents,
                      count=1,
                  )
              else:
                  raise SystemExit('GITOPS_UPDATE_MODE must be helm-values or manifest')

              expected = 2 if os.environ['GITOPS_UPDATE_MODE'] == 'helm-values' else 1
              if count != expected:
                  raise SystemExit(f'Expected {expected} image fields in {file_path}, found {count}')
              file_path.write_text(updated)
              PY

              git add "${GITOPS_FILE}"
              git diff --cached --quiet && echo "GitOps already uses ${IMAGE_TAG}" && exit 0
              git commit -m "Promote ${IMAGE_TAG} to production [skip ci]"
              git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" push origin "${GITOPS_BRANCH:-main}"
            displayName: Commit image tag to GitOps
            env:
              GITOPS_REPOSITORY: $(GITOPS_REPOSITORY)
              GITOPS_BRANCH: $(GITOPS_BRANCH)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
              GITOPS_UPDATE_MODE: $(GITOPS_UPDATE_MODE)
              GITOPS_FILE: $(GITOPS_FILE)
              IMAGE: $(ACR_LOGIN_SERVER)/$(imageRepository)
              IMAGE_TAG: $(resources.pipeline.ci.sourceCommit)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-health-check
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/ORG/PROJECT/_git/GITOPS_REPOSITORY
    targetRevision: main
    path: task-2-ci-cd/gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: db-health-check
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Replace the example Azure DevOps URL with the external GitOps repository.
# Dev and UAT reconcile automatically after the CD pipeline updates GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-health-check-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/ORG/PROJECT/_git/GITOPS_REPOSITORY
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: db-health-check-dev
  syncPolicy:
    # Keep lower environments continuously reconciled.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-health-check-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/ORG/PROJECT/_git/GITOPS_REPOSITORY
    targetRevision: main
    path: environments/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: db-health-check-uat
  syncPolicy:
    # UAT follows the same automatic GitOps flow as development.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-health-check-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/ORG/PROJECT/_git/GITOPS_REPOSITORY
    targetRevision: main
    path: environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: db-health-check-prod
  # Production intentionally has no automated sync policy.
  # An operator must review and sync the approved GitOps change manually.

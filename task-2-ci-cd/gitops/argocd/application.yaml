apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-health-check-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/ORG/PROJECT/_git/GITOPS_REPOSITORY
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: db-health-check-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-health-check
  labels:
    app.kubernetes.io/name: db-health-check
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: db-health-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-health-check
    spec:
      containers:
        - name: app
          image: db-health-check:latest
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: db-health-check
spec:
  selector:
    app.kubernetes.io/name: db-health-check
  ports:
    - name: http
      port: 80
      targetPort: http

# Azure DevOps CI pipeline: test, lint, scan, build, and publish.
# Required setup:
#   - Docker Registry service connection: acr-service-connection
#   - SonarQube service connection: sonarqube-service-connection
#   - Secret pipeline variables: SNYK_TOKEN, COSIGN_PRIVATE_KEY, COSIGN_PASSWORD, COSIGN_PUBLIC_KEY
#   - Pipeline variables: ACR_LOGIN_SERVER and SONAR_PROJECT_KEY

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  # Pin tool versions so security results are reproducible between runs.
  pythonVersion: '3.12'
  imageRepository: 'db-health-check'
  acrLoginServer: '$(ACR_LOGIN_SERVER)'
  dockerServiceConnection: 'acr-service-connection'
  sonarQubeServiceConnection: 'sonarqube-service-connection'
  sonarProjectKey: '$(SONAR_PROJECT_KEY)'
  gitleaksVersion: '8.28.0'
  trivyVersion: '0.65.0'
  cosignVersion: '2.4.1'

stages:
  # Fast feedback gate for every pull request and main branch build.
  - stage: UnitTests
    displayName: Unit tests
    jobs:
      - job: UnitTests
        displayName: Run Python unit tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt pytest
              python -m pytest -q
            displayName: Install dependencies and run unit tests

  # Keep formatting, static checks, and syntax errors out of later stages.
  - stage: Lint
    displayName: Lint and syntax check
    jobs:
      - job: Lint
        displayName: Run Ruff and compile checks
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt ruff
              ruff check app tests verify_app.py
              python -m compileall -q app tests verify_app.py
            displayName: Run lint and syntax checks

  # Scan the complete Git history; any detected secret must fail the pipeline.
  - stage: SecretScan
    displayName: Gitleaks secret scan
    jobs:
      - job: Gitleaks
        displayName: Scan repository history for secrets
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0
          - bash: |
              docker run --rm \
                -v "$(Build.SourcesDirectory):/repo" \
                zricethezav/gitleaks:v$(gitleaksVersion) \
                detect --source=/repo --no-banner --redact --exit-code 1
            displayName: Run Gitleaks

  # SonarQube evaluates source and dependency findings and publishes its gate.
  - stage: SonarQube
    displayName: SonarQube SCA analysis
    jobs:
      - job: SonarQube
        displayName: Analyze source and dependencies
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: SonarQubePrepare@7
            displayName: Prepare SonarQube analysis
            inputs:
              SonarQube: $(sonarQubeServiceConnection)
              scannerMode: cli
              configMode: manual
              cliProjectKey: $(sonarProjectKey)
              cliProjectName: db-health-check
              cliSources: .
              extraProperties: |
                sonar.python.version=$(pythonVersion)
                sonar.exclusions=**/.venv/**,**/venv/**,**/__pycache__/**
          - task: SonarQubeAnalyze@7
            displayName: Run SonarQube analysis
          - task: SonarQubePublish@7
            displayName: Publish SonarQube quality gate
            inputs:
              pollingTimeoutSec: '300'

  # Snyk performs the requested SAST dependency gate before any image is built.
  # Snyk exits with code 1 when it finds a vulnerability at any severity.
  - stage: SAST
    displayName: Snyk SAST third-party dependency scan
    jobs:
      - job: Snyk
        displayName: Scan Python dependencies with Snyk
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - bash: |
              # Sign the exact tarball produced by BuildImage and scanned by Trivy.
              # The private key stays in Azure DevOps secret variables.
              set -euo pipefail
              docker run --rm \
                -e SNYK_TOKEN \
                -v "$(Build.SourcesDirectory):/project" \
                snyk/snyk:python \
                test --file=/project/requirements.txt \
                --package-manager=pip \
                --severity-threshold=low \
                --fail-on=all
            displayName: Fail on any third-party dependency vulnerability
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)

  # Build once after all quality gates and export the exact image for later jobs.
  - stage: BuildImage
    displayName: Build Docker image
    dependsOn:
      - UnitTests
      - Lint
      - SecretScan
      - SonarQube
      - SAST
    condition: succeeded()
    jobs:
      - job: BuildImage
        displayName: Build image for security scanning
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: Docker@2
            displayName: Build commit-tagged image
            inputs:
              command: build
              repository: $(imageRepository)
              Dockerfile: Dockerfile
              tags: |
                $(Build.SourceVersion)
          - bash: |
              docker save "$(imageRepository):$(Build.SourceVersion)" \
                --output "$(Build.ArtifactStagingDirectory)/db-health-check.tar"
            displayName: Export image for downstream stages
          - task: PublishPipelineArtifact@1
            displayName: Publish image artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/db-health-check.tar
              artifact: db-health-check-image

  # Scan the exported image; any vulnerability fails the pipeline.
  - stage: Trivy
    displayName: Trivy image security scan
    dependsOn: BuildImage
    condition: succeeded()
    jobs:
      - job: Trivy
        displayName: Scan built image for vulnerabilities
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: DownloadPipelineArtifact@2
            displayName: Download built image
            inputs:
              artifactName: db-health-check-image
              path: $(Pipeline.Workspace)/db-health-check-image
          - bash: |
              # Fail CI if the signature does not match the image tarball.
              # This is a detached artifact signature, not a registry signature.
              set -euo pipefail
              docker load --input "$(Pipeline.Workspace)/db-health-check-image/db-health-check.tar"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:$(trivyVersion) \
                image --scanners vuln --exit-code 1 \
                "$(imageRepository):$(Build.SourceVersion)"
            displayName: Run Trivy against build image

  # Sign the exact image artifact before it is allowed to reach ACR.
  # This creates a detached Cosign signature for the exported image tarball.
  - stage: SignImage
    displayName: Sign image with Cosign
    dependsOn: Trivy
    condition: succeeded()
    jobs:
      - job: SignImage
        displayName: Create and verify Cosign signature
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: DownloadPipelineArtifact@2
            displayName: Download scanned image
            inputs:
              artifactName: db-health-check-image
              path: $(Pipeline.Workspace)/db-health-check-image
          - bash: |
              set -euo pipefail
              docker run --rm \
                -e COSIGN_PRIVATE_KEY \
                -e COSIGN_PASSWORD \
                -v "$(Pipeline.Workspace)/db-health-check-image:/workspace" \
                gcr.io/projectsigstore/cosign:v$(cosignVersion) \
                sign-blob --yes \
                --key env://COSIGN_PRIVATE_KEY \
                --output-signature /workspace/db-health-check.tar.sig \
                /workspace/db-health-check.tar
            displayName: Sign exported image artifact
            env:
              COSIGN_PRIVATE_KEY: $(COSIGN_PRIVATE_KEY)
              COSIGN_PASSWORD: $(COSIGN_PASSWORD)
          - bash: |
              set -euo pipefail
              docker run --rm \
                -e COSIGN_PUBLIC_KEY \
                -v "$(Pipeline.Workspace)/db-health-check-image:/workspace" \
                gcr.io/projectsigstore/cosign:v$(cosignVersion) \
                verify-blob \
                --key env://COSIGN_PUBLIC_KEY \
                --signature /workspace/db-health-check.tar.sig \
                /workspace/db-health-check.tar
            displayName: Verify Cosign signature before publish
            env:
              COSIGN_PUBLIC_KEY: $(COSIGN_PUBLIC_KEY)
          - task: PublishPipelineArtifact@1
            # CD downloads this signature from the same CI run and verifies it again.
            displayName: Publish Cosign signature artifact
            inputs:
              targetPath: $(Pipeline.Workspace)/db-health-check-image/db-health-check.tar.sig
              artifact: db-health-check-signature

  # Only main publishes the already-scanned and signed image to ACR.
  - stage: Publish
    displayName: Push image to ACR
    dependsOn: SignImage
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Publish
        displayName: Publish commit-tagged image
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: DownloadPipelineArtifact@2
            displayName: Download scanned image
            inputs:
              artifactName: db-health-check-image
              path: $(Pipeline.Workspace)/db-health-check-image
          - task: DownloadPipelineArtifact@2
            displayName: Download verified image signature
            inputs:
              artifactName: db-health-check-signature
              path: $(Pipeline.Workspace)/db-health-check-signature
          - bash: |
              test -s "$(Pipeline.Workspace)/db-health-check-signature/db-health-check.tar.sig"
            displayName: Require verified Cosign signature
          - task: Docker@2
            displayName: Log in to ACR
            inputs:
              command: login
              containerRegistry: $(dockerServiceConnection)
          - bash: |
              set -euo pipefail
              docker load --input "$(Pipeline.Workspace)/db-health-check-image/db-health-check.tar"
              docker tag "$(imageRepository):$(Build.SourceVersion)" \
                "$(acrLoginServer)/$(imageRepository):$(Build.SourceVersion)"
              docker tag "$(imageRepository):$(Build.SourceVersion)" \
                "$(acrLoginServer)/$(imageRepository):latest"
              docker push "$(acrLoginServer)/$(imageRepository):$(Build.SourceVersion)"
              docker push "$(acrLoginServer)/$(imageRepository):latest"
            displayName: Push signed image to ACR
          - bash: |
              echo "Published $(acrLoginServer)/$(imageRepository):$(Build.SourceVersion)"
            displayName: Report published image
